name: Refresh news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-news
  cancel-in-progress: true

jobs:
  news:
    name: Run news pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Call news pipeline
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          : "${BASE_URL:?Missing BASE_URL secret}"
          if [ -z "${CRON_SECRET:-}" ] && [ -z "${PIPELINE_SECRET:-}" ]; then
            echo "Missing auth secret: set CRON_SECRET or PIPELINE_SECRET" >&2
            exit 1
          fi

          headers=()
          if [ -n "${CRON_SECRET:-}" ]; then
            headers+=(-H "x-cron-secret: ${CRON_SECRET}")
          fi
          if [ -n "${PIPELINE_SECRET:-}" ]; then
            headers+=(-H "x-pipeline-secret: ${PIPELINE_SECRET}")
          fi

          url="${BASE_URL}/api/news/pipeline"
          tmp=$(mktemp)
          code=$(curl -sS -w "%{http_code}" -o "$tmp" --retry 3 --retry-delay 5 \
            "${headers[@]}" \
            -X POST "$url")
          echo "HTTP $code"
          cat "$tmp"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Request failed: $url" >&2
            exit 1
          fi
